<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Asistencia · GLOBECO SMART</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071A2B;--bg2:#0B2440;--surface:rgba(255,255,255,.06);--surface-2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.12);--ink:#EAF2FB;--muted:#93A8BF;
  --blue:#378ADD;--teal:#1D9E75;--amber:#E0A83D;--red:#E0655A;
}
:root[data-theme="light"]{
  --bg:#EEF3F8;--bg2:#FFFFFF;--surface:rgba(255,255,255,.8);--surface-2:rgba(7,26,43,.05);
  --line:rgba(7,26,43,.12);--ink:#071A2B;--muted:#5B6F84;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF3F8;--bg2:#FFFFFF;--surface:rgba(255,255,255,.8);--surface-2:rgba(7,26,43,.05);
    --line:rgba(7,26,43,.12);--ink:#071A2B;--muted:#5B6F84;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(120% 60% at 50% -10%,rgba(55,138,221,.28),transparent 60%),
             radial-gradient(90% 50% at 100% 100%,rgba(29,158,117,.18),transparent 60%),var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}

/* barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ibtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ttl{flex:1;text-align:center}
.ttl b{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.06em;display:block;line-height:1}
.ttl small{font-size:11.5px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);margin-bottom:14px}

/* reloj */
.reloj{text-align:center;padding:20px 18px 18px}
.reloj .h{font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:.04em;line-height:1}
.reloj .h span{font-size:34px;color:var(--muted);margin-left:4px}
.reloj .f{font-size:13.5px;color:var(--muted);margin-top:4px}
.reloj .f::first-letter{text-transform:uppercase}
.reloj .who{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
.av{width:38px;height:38px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--blue),var(--teal));display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:0 0 auto}
.av img{width:100%;height:100%;object-fit:cover}
.who div{text-align:left}
.who b{font-size:14px;display:block}
.who small{font-size:12px;color:var(--muted)}

/* jornada en curso */
.curso{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:96px;height:96px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1}
.ring .v small{font-size:10px;color:var(--muted);display:block}
.curso .t{flex:1;min-width:0}
.curso .t b{font-size:15px;display:block;margin-bottom:3px}
.curso .t p{font-size:13px;color:var(--muted);line-height:1.5}
.curso .t .extra{color:var(--amber);font-weight:600}

/* planta y zona */
.zona{display:flex;gap:12px;align-items:center}
.zona .dot{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;background:var(--surface-2)}
.zona .dot i{width:14px;height:14px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 6px rgba(147,168,191,.18)}
.zona.ok .dot i{background:var(--teal);box-shadow:0 0 0 6px rgba(29,158,117,.2);animation:pulso 1.8s infinite}
.zona.fuera .dot i{background:var(--amber);box-shadow:0 0 0 6px rgba(224,168,61,.2)}
.zona.mal .dot i{background:var(--red);box-shadow:0 0 0 6px rgba(224,101,90,.2)}
@keyframes pulso{50%{box-shadow:0 0 0 11px rgba(29,158,117,0)}}
.zona b{font-size:14.5px;display:block}
.zona small{font-size:12.5px;color:var(--muted);line-height:1.45;display:block}

/* botón principal */
.big{width:100%;height:74px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:12px;
  font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.08em;color:#fff;
  background:linear-gradient(135deg,var(--teal),#17b58a);box-shadow:0 18px 36px -18px rgba(29,158,117,.9);
  transition:transform .15s,opacity .2s;margin-bottom:14px}
.big.salida{background:linear-gradient(135deg,#2c6fb8,var(--blue));box-shadow:0 18px 36px -18px rgba(55,138,221,.9)}
.big:active{transform:scale(.97)}
.big:disabled{opacity:.45}

/* historial */
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:6px 4px 10px}
.sect h2{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:.06em}
.sect small{font-size:12px;color:var(--muted)}
.hist{list-style:none}
.hist li{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .d{width:48px;text-align:center;flex:0 0 auto}
.hist .d b{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;display:block}
.hist .d small{font-size:10.5px;color:var(--muted);text-transform:uppercase}
.hist .m{flex:1;min-width:0;font-size:13px}
.hist .m span{color:var(--muted)}
.hist .n{text-align:right;font-size:12px;color:var(--muted)}
.hist .n b{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--ink);display:block;line-height:1}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:4px}
.tag.fz{background:rgba(224,168,61,.18);color:var(--amber)}
.tag.ex{background:rgba(55,138,221,.18);color:var(--blue)}
.tag.ab{background:rgba(29,158,117,.18);color:var(--teal)}
.tag.ss{background:rgba(224,101,90,.18);color:var(--red)}
.vacio{font-size:13px;color:var(--muted);text-align:center;padding:14px 0}

/* aviso general */
.aviso{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border-radius:16px;font-size:13px;line-height:1.5;margin-bottom:14px}
.aviso.warn{background:rgba(224,168,61,.13);border:1px solid rgba(224,168,61,.4)}
.aviso.bad{background:rgba(224,101,90,.13);border:1px solid rgba(224,101,90,.42)}
.aviso b{display:block}

/* cámara */
.cam{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column}
.cam.on{display:flex}
.cam .vista{flex:1;position:relative;overflow:hidden}
.cam video,.cam img.prev{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam video{transform:scaleX(-1)}
.cam .marco{position:absolute;left:50%;top:44%;width:62vw;max-width:300px;aspect-ratio:3/4;transform:translate(-50%,-50%);
  border:2px dashed rgba(255,255,255,.55);border-radius:50%}
.cam .sello{position:absolute;left:12px;right:12px;bottom:12px;color:#fff;font-size:12.5px;line-height:1.45;
  background:rgba(7,26,43,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 12px;border-radius:14px}
.cam .sello b{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.06em;display:block}
.cam .barra{display:flex;align-items:center;justify-content:space-around;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));background:#000}
.cam .barra button{color:#fff;font-weight:600;font-size:15px;min-width:90px;padding:10px}
.disparo{width:78px!important;min-width:78px!important;height:78px;border-radius:50%;border:4px solid #fff!important;padding:0!important;display:grid;place-items:center}
.disparo i{width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .12s}
.disparo:active i{transform:scale(.88)}
.cam .ok{background:var(--teal);border-radius:14px}

/* resultado */
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal.on{display:flex}
.hoja{width:100%;max-width:520px;background:var(--bg2);border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));
  border:1px solid var(--line);animation:sube .28s ease}
@keyframes sube{from{transform:translateY(40px);opacity:0}}
.hoja .ico{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;margin:0 auto 12px;background:rgba(29,158,117,.16);color:var(--teal)}
.hoja.fz .ico{background:rgba(224,168,61,.16);color:var(--amber)}
.hoja h3{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.05em;text-align:center;line-height:1}
.hoja .hr{font-family:'Bebas Neue',sans-serif;font-size:48px;text-align:center;letter-spacing:.04em;margin:6px 0 2px}
.hoja .sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:16px}
.tabla{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tabla div{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.tabla small{font-size:11px;color:var(--muted);display:block}
.tabla b{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.03em}
.primary{width:100%;height:54px;border-radius:18px;background:var(--blue);color:#fff;font-weight:700;font-size:15.5px}

.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:gira .8s linear infinite;display:inline-block}
@keyframes gira{to{transform:rotate(360deg)}}
.cargando{min-height:60vh;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center}
.cargando .spin{border-color:var(--line);border-top-color:var(--blue);width:34px;height:34px;margin:0 auto 14px;display:block}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:40;
  background:var(--bg2);border:1px solid var(--line);padding:12px 16px;border-radius:14px;font-size:13.5px;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;font-size:11.5px;color:var(--muted);margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="ibtn" id="volver" href="../portal/" aria-label="Volver al portal">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="ttl"><b>Asistencia</b><small>Registro de jornada</small></div>
    <button class="ibtn" id="tema" aria-label="Cambiar tema"></button>
  </div>
  <div id="main"><div class="cargando"><div><span class="spin"></span>Cargando tu jornada…</div></div></div>
  <footer>GLOBECO SMART · Designed by <b>W.I.G.</b> — CTO &amp; DoA</footer>
</div>

<!-- cámara -->
<div class="cam" id="cam">
  <div class="vista">
    <video id="video" playsinline muted autoplay></video>
    <img class="prev" id="prev" alt="" hidden>
    <div class="marco" id="marco"></div>
    <div class="sello" id="sello"></div>
  </div>
  <div class="barra" id="barra"></div>
</div>
<input type="file" id="archivo" accept="image/*" capture="user" hidden>

<div class="modal" id="modal"><div class="hoja" id="hoja"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   CONFIGURACIÓN
   La dirección del servidor la deja el portal al entrar (gs-api).
   Solo llena API_URL si quieres fijarla aquí.
   ===================================================================== */
const CONFIG={
  API_URL:"",
  JORNADA_H:8,
  GPS_MAX_M:150        // precisión mínima aceptable del GPS
};

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
          set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const p2=n=>String(n).padStart(2,'0');
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000);}
const iniciales=n=>String(n||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();

/* hora de Ecuador a partir de un instante (sin depender del huso del teléfono) */
function ec(ms){const d=new Date(ms-5*36e5);return{h:d.getUTCHours(),m:d.getUTCMinutes(),s:d.getUTCSeconds(),
  dia:d.getUTCDate(),mes:d.getUTCMonth(),anio:d.getUTCFullYear(),dow:d.getUTCDay()};}
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const hms=ms=>{const x=ec(ms);return p2(x.h)+':'+p2(x.m)+':'+p2(x.s);};
const hm=ms=>{const x=ec(ms);return p2(x.h)+':'+p2(x.m);};
const dur=ms=>{ms=Math.max(0,ms);const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h+'h '+p2(m)+'m';};
const horasTxt=h=>{h=Number(h)||0;const H=Math.floor(h),M=Math.round((h-H)*60);return H+'h '+p2(M)+'m';};

/* ---------- tema ---------- */
const root=document.documentElement,mq=matchMedia('(prefers-color-scheme: light)');
const SOL='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const LUNA='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const temaActual=()=>root.getAttribute('data-theme')||(mq.matches?'light':'dark');
function pintarTema(){$('#tema').innerHTML=temaActual()==='light'?LUNA:SOL;}
const guardado=LS.get('gs-theme',null);if(guardado)root.setAttribute('data-theme',guardado);
$('#tema').onclick=()=>{const n=temaActual()==='light'?'dark':'light';root.setAttribute('data-theme',n);LS.set('gs-theme',n);pintarTema();};
pintarTema();

/* ---------- sesión del portal ---------- */
const SES=(()=>{const s=LS.get('gs-sesion',null);return s&&s.exp>Date.now()?s:null;})();
const API=()=>CONFIG.API_URL||LS.get('gs-api','');
const DEVICE=LS.get('gs-device','');

async function api(cuerpo){
  const url=API(); if(!url)throw new Error('sin_api');
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000);
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:JSON.stringify({...cuerpo,token:SES.token,device:DEVICE}),signal:ctl.signal,redirect:'follow'});
    return await r.json();
  }finally{clearTimeout(to);}
}

/* =====================================================================
   ESTADO
   ===================================================================== */
let E=null;             // respuesta de as_estado
let DESFASE=0;          // reloj del servidor - reloj del teléfono
let POS=null;           // última lectura GPS
let GPS_ERR='';         // motivo si no hay GPS
let watchId=null;

async function cargar(silencioso){
  if(!navigator.onLine){pintarSinSenal();return;}
  try{
    const t0=Date.now();
    const r=await api({action:'as_estado'});
    const viaje=Date.now()-t0;
    if(!r.ok){pintarError(r.error);return;}
    DESFASE=r.ahora+viaje/2-Date.now();
    E=r; pintar();
  }catch(e){
    if(!silencioso)pintarError(String(e.message)==='sin_api'?'sin_api':'red');
  }
}

/* =====================================================================
   PANTALLAS
   ===================================================================== */
const MSG={
  sin_permiso:['No tienes habilitada la asistencia','Pide a tu supervisor que agregue «asistencia» a tus permisos.'],
  sesion_expirada:['Tu sesión caducó','Vuelve al portal y entra con tu PIN.'],
  otro_dispositivo:['Tu sesión se abrió en otro teléfono','Vuelve al portal y entra con tu PIN.'],
  inactivo:['Tu usuario está inactivo','Contacta a tu supervisor.'],
  no_encontrado:['No encontramos tu registro','Contacta a soporte.'],
  sin_api:['Falta conectar el servidor','Abre primero el portal para que se configure.'],
  red:['No pudimos conectar','Revisa tu señal e intenta otra vez.']
};
function pintarError(cod){
  const m=MSG[cod]||['Algo salió mal','Intenta otra vez en un momento. ('+esc(cod)+')'];
  $('#main').innerHTML=`<div class="aviso bad"><div><b>${m[0]}</b>${m[1]}</div></div>
    <button class="primary" onclick="location.href='../portal/'">Volver al portal</button>`;
}
function pintarSinSenal(){
  $('#main').innerHTML=`<div class="aviso warn"><div><b>Necesitas señal para timbrar</b>
    La hora la registra el servidor, no tu teléfono, para que sea exacta y nadie pueda alterarla.
    Busca cobertura e intenta de nuevo.</div></div>
    <button class="primary" onclick="cargar()">Reintentar</button>`;
}

function pintar(){
  const abierta=E.abierta;
  const pl=E.planta;
  let aviso='';
  if(!E.planta_asignada) aviso=`<div class="aviso warn"><div><b>No tienes una planta asignada</b>Pide a tu supervisor que la registre en la columna «Planta» de la Base de identificaciones.</div></div>`;
  else if(!pl) aviso=`<div class="aviso warn"><div><b>La planta «${esc(E.planta_asignada)}» no tiene ubicación</b>Tu supervisor debe registrar sus coordenadas en la hoja de Asistencia.</div></div>`;

  $('#main').innerHTML=`
    <section class="card reloj">
      <div class="h" id="hora">--:--<span>--</span></div>
      <div class="f" id="fecha"></div>
      <div class="who">
        <span class="av">${SES.foto?`<img src="${esc(SES.foto)}" alt="">`:esc(iniciales(SES.nombre))}</span>
        <div><b>${esc(SES.nombre||'')}</b><small>${esc([SES.cargo,SES.id_gl].filter(Boolean).join(' · '))}</small></div>
      </div>
    </section>

    ${aviso}

    ${abierta?`<section class="card curso">
      <div class="ring"><svg width="96" height="96"><circle cx="48" cy="48" r="41" stroke="var(--surface-2)" stroke-width="9" fill="none"/>
        <circle id="arco" cx="48" cy="48" r="41" stroke="var(--teal)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="257.6" stroke-dashoffset="257.6"/></svg>
        <div class="v"><div><b id="trans">0h 00m</b><small>de ${CONFIG.JORNADA_H} h</small></div></div></div>
      <div class="t"><b>Jornada en curso</b>
        <p>Entrada a las <b style="display:inline">${hms(abierta.entrada)}</b>${abierta.zona==='FUERA DE ZONA'?' <span class="tag fz">fuera de zona</span>':''}</p>
        <p id="restan"></p></div>
    </section>`:''}

    <section class="card zona" id="zona">
      <span class="dot"><i></i></span>
      <div><b id="zT">Buscando tu ubicación…</b><small id="zS">${pl?'Planta: '+esc(pl.nombre):''}</small></div>
    </section>

    <button class="big${abierta?' salida':''}" id="marcar" ${pl?'':'disabled'}>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="11" r="3"/><path d="M8 17c.8-1.6 2.3-2.5 4-2.5s3.2.9 4 2.5"/></svg>
      ${abierta?'Marcar salida':'Marcar entrada'}
    </button>

    <div class="sect"><h2>Últimas jornadas</h2><small>${E.historial.length?'':''}</small></div>
    <section class="card" style="padding:6px 16px">${historial()}</section>`;

  $('#marcar').onclick=()=>abrirCamara(abierta?'SALIDA':'ENTRADA');
  tic(); pintarZona();
}

function historial(){
  if(!E.historial.length)return '<div class="vacio">Aquí aparecerán tus jornadas.</div>';
  return '<ul class="hist">'+E.historial.map(j=>{
    const [a,m,d]=String(j.fecha).split('-');
    const tags=[];
    if(j.estado==='ABIERTA')tags.push('<span class="tag ab">en curso</span>');
    if(j.estado==='SIN SALIDA')tags.push('<span class="tag ss">sin salida</span>');
    if(j.zEnt==='FUERA DE ZONA'||j.zSal==='FUERA DE ZONA')tags.push('<span class="tag fz">fuera de zona</span>');
    const extra=(Number(j.sup)||0)+(Number(j.ext)||0);
    if(extra>0)tags.push(`<span class="tag ex">+${horasTxt(extra)}</span>`);
    return `<li><div class="d"><b>${esc(d||'')}</b><small>${esc(String(j.dia||'').slice(0,3))}</small></div>
      <div class="m">${j.entrada?hm(j.entrada):'--:--'} <span>→</span> ${j.salida?hm(j.salida):'--:--'}<br>${tags.join('')||'<span>'+esc(j.tipo||'')+'</span>'}</div>
      <div class="n">${j.estado==='CERRADA'?`<b>${horasTxt(j.neto)}</b>netas`:''}</div></li>`;
  }).join('')+'</ul>';
}

/* ---------- reloj y contador ---------- */
function tic(){
  const ahora=Date.now()+DESFASE, x=ec(ahora);
  const h=$('#hora'); if(!h)return;
  h.innerHTML=p2(x.h)+':'+p2(x.m)+'<span>'+p2(x.s)+'</span>';
  $('#fecha').textContent=`${DIAS[x.dow]}, ${x.dia} de ${MESES[x.mes]} de ${x.anio}`;
  if(E&&E.abierta){
    const pasado=ahora-E.abierta.entrada, meta=CONFIG.JORNADA_H*36e5;
    // se descuenta el almuerzo si ya pasaron 5 h, igual que el servidor
    const neto=pasado>5*36e5?pasado-36e5:pasado;
    $('#trans').textContent=dur(neto);
    $('#arco').style.strokeDashoffset=257.6*(1-Math.min(1,neto/meta));
    $('#arco').style.stroke=neto>=meta?'var(--amber)':'var(--teal)';
    $('#restan').innerHTML=neto>=meta
      ?`<span class="extra">Cumpliste tus ${CONFIG.JORNADA_H} h. Llevas ${dur(neto-meta)} extra.</span>`
      :`Te faltan ${dur(meta-neto)} para completar la jornada.`;
  }
}
setInterval(tic,1000);

/* ---------- GPS ---------- */
function distancia(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;
  const s=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function iniciarGPS(){
  if(!('geolocation' in navigator)){GPS_ERR='Tu teléfono no permite ubicación.';pintarZona();return;}
  watchId=navigator.geolocation.watchPosition(p=>{
    POS={lat:p.coords.latitude,lng:p.coords.longitude,precision:Math.round(p.coords.accuracy),t:Date.now()};
    GPS_ERR='';pintarZona();
  },e=>{
    GPS_ERR=e.code===1?'Permiso de ubicación negado. Actívalo en los ajustes del navegador para poder timbrar.'
          :'No logramos ubicarte. Sal a cielo abierto o activa el GPS.';
    pintarZona();
  },{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function pintarZona(){
  const z=$('#zona'); if(!z||!E)return;
  z.className='card zona';
  const pl=E.planta;
  if(GPS_ERR){z.classList.add('mal');$('#zT').textContent='Sin ubicación';$('#zS').textContent=GPS_ERR;return;}
  if(!POS){$('#zT').textContent='Buscando tu ubicación…';$('#zS').textContent=pl?'Planta: '+pl.nombre:'';return;}
  if(!pl){$('#zT').textContent='Ubicación lista';$('#zS').textContent=`Precisión ±${POS.precision} m`;return;}
  const d=Math.round(distancia(POS.lat,POS.lng,pl.lat,pl.lng));
  const dentro=d<=pl.radio;
  z.classList.add(dentro?'ok':'fuera');
  $('#zT').textContent=dentro?`Estás en ${pl.nombre}`:`Estás a ${d>=1000?(d/1000).toFixed(1)+' km':d+' m'} de ${pl.nombre}`;
  $('#zS').textContent=(dentro?`A ${d} m del punto · radio ${pl.radio} m`
    :`Debes estar a menos de ${pl.radio} m. Si timbras aquí quedará marcado como fuera de zona.`)
    +(POS.precision>CONFIG.GPS_MAX_M?` · GPS impreciso (±${POS.precision} m), espera unos segundos`:` · ±${POS.precision} m`);
}

/* =====================================================================
   CÁMARA
   ===================================================================== */
let TIPO='', STREAM=null, FOTO='';
async function abrirCamara(tipo){
  if(!navigator.onLine){toast('Necesitas señal para timbrar.');return;}
  if(GPS_ERR){toast(GPS_ERR);return;}
  if(!POS){toast('Todavía estamos buscando tu ubicación. Espera unos segundos.');return;}
  if(POS.precision>CONFIG.GPS_MAX_M){toast(`El GPS aún no es preciso (±${POS.precision} m). Espera unos segundos.`);return;}
  TIPO=tipo; FOTO='';
  $('#cam').classList.add('on');
  $('#prev').hidden=true; $('#video').hidden=false; $('#marco').hidden=false;
  pintarSello();
  barraCaptura();
  try{
    STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});
    $('#video').srcObject=STREAM;
  }catch(e){
    // sin acceso directo: usamos la cámara del sistema
    cerrarCamara(); $('#archivo').value=''; $('#archivo').click();
  }
}
function pintarSello(){
  const pl=E.planta, d=pl&&POS?Math.round(distancia(POS.lat,POS.lng,pl.lat,pl.lng)):null;
  $('#sello').innerHTML=`<b>${TIPO==='ENTRADA'?'Entrada':'Salida'} · ${hms(Date.now()+DESFASE)}</b>
    ${esc(SES.nombre||'')}<br>${pl?esc(pl.nombre)+(d!==null?' · a '+d+' m':''):''}`;
}
function barraCaptura(){
  $('#barra').innerHTML=`<button id="cCancel">Cancelar</button>
    <button class="disparo" id="cShot" aria-label="Tomar foto"><i></i></button><span style="min-width:90px"></span>`;
  $('#cCancel').onclick=cerrarCamara;
  $('#cShot').onclick=disparar;
}
function cerrarCamara(){
  if(STREAM){STREAM.getTracks().forEach(t=>t.stop());STREAM=null;}
  $('#cam').classList.remove('on');
}
function disparar(){
  const v=$('#video'); if(!v.videoWidth){toast('La cámara aún no está lista.');return;}
  FOTO=comprimir(v,v.videoWidth,v.videoHeight,true);
  if(STREAM){STREAM.getTracks().forEach(t=>t.stop());STREAM=null;}
  mostrarPrevia();
}
$('#archivo').onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const img=new Image();
  img.onload=()=>{FOTO=comprimir(img,img.naturalWidth,img.naturalHeight,false);URL.revokeObjectURL(img.src);
    $('#cam').classList.add('on');$('#video').hidden=true;pintarSello();mostrarPrevia();};
  img.src=URL.createObjectURL(f);
};
/* 720 px de ancho, JPEG 72% (~60-90 KB): suficiente para reconocer a la persona */
function comprimir(src,w,h,espejo){
  const W=Math.min(720,w),H=Math.round(h*W/w);
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  if(espejo){x.translate(W,0);x.scale(-1,1);}
  x.drawImage(src,0,0,W,H);
  return c.toDataURL('image/jpeg',.72);
}
function mostrarPrevia(){
  $('#video').hidden=true;$('#marco').hidden=true;
  const p=$('#prev');p.src=FOTO;p.hidden=false;
  $('#barra').innerHTML=`<button id="cOtra">Repetir</button><button class="ok" id="cOk">Enviar ${TIPO==='ENTRADA'?'entrada':'salida'}</button>`;
  $('#cOtra').onclick=()=>abrirCamara(TIPO);
  $('#cOk').onclick=enviar;
}

/* =====================================================================
   ENVIAR
   ===================================================================== */
const ERR_MARCA={
  ya_tiene_entrada:'Ya tienes una entrada abierta. Marca la salida.',
  sin_entrada:'No tienes una entrada abierta hoy.',
  gps_impreciso:'El GPS no es preciso. Espera unos segundos a cielo abierto.',
  sin_ubicacion:'No llegó tu ubicación. Activa el GPS.',
  sin_foto:'Falta la foto.',foto_pesada:'La foto es muy pesada. Repítela.',
  sin_planta:'No tienes planta asignada.',planta_desconocida:'Tu planta no tiene ubicación registrada.',
  ocupado:'El servidor está ocupado. Intenta en unos segundos.'
};
async function enviar(){
  const b=$('#cOk');b.disabled=true;b.innerHTML='<span class="spin"></span>';
  try{
    const r=await api({action:'as_marcar',tipo:TIPO,foto:FOTO,lat:POS.lat,lng:POS.lng,precision:POS.precision});
    if(!r.ok){
      if(MSG[r.error]&&!ERR_MARCA[r.error]){cerrarCamara();pintarError(r.error);return;}
      toast(ERR_MARCA[r.error]||'No se pudo registrar. Intenta otra vez.');
      b.disabled=false;b.textContent='Reintentar';
      if(r.error==='ya_tiene_entrada'||r.error==='sin_entrada'){cerrarCamara();cargar();}
      return;
    }
    cerrarCamara();
    E=r.estado; DESFASE=r.estado.ahora-Date.now(); pintar();
    resultado(r);
    if(navigator.vibrate)navigator.vibrate(60);
  }catch(e){
    b.disabled=false;b.textContent='Reintentar';
    toast(navigator.onLine?'No pudimos conectar. Intenta otra vez.':'Te quedaste sin señal. Intenta al recuperarla.');
  }
}
function resultado(r){
  const fz=r.zona==='FUERA DE ZONA', c=r.resumen;
  const check='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const alerta='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 9v4M12 17v.1"/><path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
  $('#hoja').className='hoja'+(fz?' fz':'');
  $('#hoja').innerHTML=`<div class="ico">${fz?alerta:check}</div>
    <h3>${r.tipo==='ENTRADA'?'Entrada registrada':'Salida registrada'}</h3>
    <div class="hr">${esc(r.hora)}</div>
    <div class="sub">${esc(r.planta)} · ${fz?`<b style="color:var(--amber)">fuera de zona, a ${r.distancia} m</b>`:`en zona, a ${r.distancia} m`}</div>
    ${c?`<div class="tabla">
      <div><small>Horas netas</small><b>${horasTxt(c.neto)}</b></div>
      <div><small>Ordinarias</small><b>${horasTxt(c.ord)}</b></div>
      <div><small>Suplementarias 50%</small><b>${horasTxt(c.sup)}</b></div>
      <div><small>Extraordinarias 100%</small><b>${horasTxt(c.ext)}</b></div>
    </div>`:''}
    ${fz?'<div class="aviso warn" style="margin-bottom:14px"><div>Quedó registrado, pero marcado <b style="display:inline">fuera de zona</b>. Tu supervisor lo revisará.</div></div>':''}
    <button class="primary" id="mOk">Listo</button>`;
  $('#modal').classList.add('on');
  $('#mOk').onclick=()=>$('#modal').classList.remove('on');
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
(function start(){
  if(!SES){pintarError('sesion_expirada');return;}
  iniciarGPS();
  cargar();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&navigator.onLine&&!$('#cam').classList.contains('on'))cargar(true);});
  addEventListener('online',()=>cargar(true));
  addEventListener('offline',()=>{if(!$('#cam').classList.contains('on'))pintarSinSenal();});
})();
</script>
</body>
